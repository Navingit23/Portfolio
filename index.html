<!DOCTYPE html>
<html>

<head>
    <title>IndiMart- E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo">IndiMart</div>

        <input type="text" id="searchInput" placeholder="Search products">

        <div class="nav-buttons">
            <button onclick="showWishlist()">Wishlist ❤️<span id="wishlistCount">0</span></button>
            <button onclick="showCart()">Cart 🛒 <span id="cartCount">0</span></button>
        </div>
    </header>


    <!-- Hero Section -->
    <section class="hero">

        <div>
            <h1>Welcome to IndiMart</h1>

            <p>Shop Smart. Shop Easy. Shop Everything.</p>

            <button onclick="scrollToProducts()">Shop Now</button>
        </div>

    </section>


    <!-- Categories -->
    <section class="categories">

        <h2>Categories</h2>

        <div class="category-buttons">

            <button onclick="filterProducts('All')">All</button>

            <button onclick="filterProducts('Electronics')">
                Electronics
            </button>

            <button onclick="filterProducts('Fashion')">
                Fashion
            </button>

            <button onclick="filterProducts('Shoes')">
                Shoes
            </button>

            <button onclick="filterProducts('Accessories')">
                Accessories
            </button>

        </div>

    </section>


    <!-- Products -->
    <section class="products-section" id="productsSection">

        <h2>Our Products</h2>

        <div id="productContainer" class="product-container">

        </div>

    </section>


    <!-- Cart -->
    <div id="cartModal" class="modal">

        <div class="modal-content">

            <span class="close" onclick="closeCart()">X</span>

            <h2>Shopping Cart 🛒</h2>

            <div id="cartItems"></div>

            <h3>
                Total: ₹<span id="cartTotal">0</span>
            </h3>

            <button class="checkout-btn" onclick="checkout()">
                Checkout
            </button>

        </div>

    </div>


    <!-- Wishlist -->
    <div id="wishlistModal" class="modal">

        <div class="modal-content">

            <span class="close" onclick="closeWishlist()">X</span>

            <h2>Wishlist ❤️</h2>

            <div id="wishlistItems"></div>

        </div>

    </div>


    <!-- Checkout -->
    <div id="checkoutModal" class="modal">

        <div class="modal-content">

            <span class="close" onclick="closeCheckout()">X</span>

            <h2>Checkout</h2>

            <form onsubmit="placeOrder(event)">

                <input type="text" id="customerName" placeholder="Enter your name" required>

                <input type="tel" id="phone" placeholder="Enter phone number" required>

                <textarea id="address" placeholder="Enter delivery address" required></textarea>

                <select id="payment" required>

                    <option value="">
                        Select Payment Method
                    </option>

                    <option>Cash on Delivery</option>

                    <option>UPI</option>

                    <option>Credit Card</option>

                    <option>Debit Card</option>

                </select>

                <button type="submit" class="place-order">
                    Place Order
                </button>

            </form>

        </div>

    </div>


    <!-- Footer -->
    <footer>

        <h3>IndiMart</h3>

        <p>© 2026 IndiMart. All Rights Reserved.</p>

        <p>HTML | CSS | JavaScript E-Commerce Project</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
